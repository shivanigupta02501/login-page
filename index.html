<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <div class="contentbox">
            <h1 class="welcome">Welcome Back!</h1>
            <p>To keep connected with us please<br>login with your personal info</p>
            <!-- <button type="submit" class="signinbtn">SIGN IN</button> -->
        </div>
        <div class="createAct">
                <h1 class="create">Create Account</h1>
                <div class="icons">
                <a href="#"><i class="fa-brands fa-facebook-f icon"></i></a>
                <a href="#"><i class="fa-brands fa-google-plus-g icon"></i></a>
                <a href="#"><i class="fa-brands fa-linkedin-in icon"></i></a>
        </div>

                <span>or use your email for registration :</span>

        <form>
                <div class="inputbox">
                    <i class="fa-regular fa-user icon"></i> 
                    <input type="text" id="username" placeholder="Name" required>
                </div>
                <div class="inputbox">
                    <i class="fa-regular fa-envelope icon"></i>
                    <input type="email" id="useremail" placeholder="Email" required>
                </div>
                <div class="inputbox">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <div class="button">
                    <button type="submit">SIGN UP</button>
                </div>
            </form>
    </div>

    <div>
        <h1>hello , welcome to my world !</h1>
    </div>
    
</body>
</html>
